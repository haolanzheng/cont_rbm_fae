[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contgreedy"
version = "0.1.0"
description = "Continuous greedy reduced basis research code"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.38,<0.11", "numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.7,<4", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
fae-torch = ["torch>=2.4,<3"]
fae-jax = ["jax==0.6.2", "flax==0.10.7", "optax==0.2.5"]
fem = ["scikit-fem>=11,<13"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

